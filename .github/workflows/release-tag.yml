name: Tagged releases

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Build only, skip release/upload'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  validate-tag:
    name: Validate tag
    runs-on: ubuntu-24.04
    steps:
      - name: Check tag-name format
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [[ ! "${REF_NAME}" =~ ^v[0-9]{1,2}\.[0-9]{1,2}\.[0-9]{1,2}-rc[0-9]{1,2}$ ]]; then
            echo "Tag '${REF_NAME}' does not match v<M.m.p-rcN>" >&2
            echo "Releases must be cut via the 'Release prepare' workflow." >&2
            exit 1
          fi

      - name: Checkout source code
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Verify version.properties matches tag
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Strip leading 'v' to get the bare version name.
          tag_name="${REF_NAME#v}"
          # bump.sh in check mode emits current_name=...
          parsed=$(./tools/release/bump.sh --mode=check)
          current_name=$(echo "$parsed" | grep -E '^current_name=' | cut -d= -f2)
          if [[ "$current_name" != "$tag_name" ]]; then
            echo "Tag '${REF_NAME}' does not match version.properties name '$current_name'" >&2
            echo "version.properties + VERSION must equal the tag — releases must be cut via 'Release prepare'." >&2
            exit 1
          fi

  release-github:
    needs: validate-tag
    name: Create GitHub release
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    environment: foss-production
    steps:
      - name: Guard against publishing from a non-tag ref
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run) && !startsWith(github.ref, 'refs/tags/')"
        env:
          REF: ${{ github.ref }}
        run: |
          echo "Refusing to build/publish a release from non-tag ref: ${REF}" >&2
          echo "Non-dry runs must target a 'v*' tag; use a dry run to build from a branch." >&2
          exit 1

      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      # Makes reruns safe: a published release with an APK skips the build and the
      # release, a stale draft from a failed run is deleted and rebuilt, and a
      # published release without an APK or a failed lookup fails the job.
      - name: Reconcile existing release
        id: existing_release
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REF_NAME: ${{ github.ref_name }}
        run: ./tools/release/reconcile-release.sh "$REF_NAME" "$GITHUB_REPOSITORY"

      - name: Decode Keystore
        if: steps.existing_release.outputs.published != 'true'
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          TMP_KEYSTORE_DIR_PATH="${RUNNER_TEMP}"/keystore
          mkdir -p "${TMP_KEYSTORE_DIR_PATH}"
          TMP_KEYSTORE_FILE_PATH="${TMP_KEYSTORE_DIR_PATH}"/keystore.jks
          echo $ENCODED_KEYSTORE | base64 -di > "${TMP_KEYSTORE_FILE_PATH}"
          echo "STORE_PATH=$(echo $TMP_KEYSTORE_FILE_PATH)" >> $GITHUB_ENV

      - name: Setup project and build environment
        if: steps.existing_release.outputs.published != 'true'
        uses: ./.github/actions/common-setup

      - name: Assemble production APK
        if: steps.existing_release.outputs.published != 'true'
        run: ./gradlew assembleFossRelease
        env:
          VERSION: ${{ github.ref }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Create release
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run) && steps.existing_release.outputs.published != 'true'"
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda #v3.0.0
        with:
          prerelease: false
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: app/build/outputs/apk/foss/release/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Releases created with GITHUB_TOKEN start no workflows, but a dispatch does.
  # The website's changelog is built from the GitHub releases.
  refresh-pages:
    needs: release-github
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.dry_run) }}
    name: Rebuild the website changelog
    runs-on: ubuntu-24.04
    permissions:
      actions: write
    steps:
      - name: Dispatch the Pages workflow on main
        run: gh workflow run pages.yml --ref main --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}

  release-gplay:
    needs: validate-tag
    name: Create Google Play release
    runs-on: ubuntu-24.04
    environment: gplay-production-upload
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/fastlane/Gemfile
    steps:
      - name: Decode Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          TMP_KEYSTORE_DIR_PATH="${RUNNER_TEMP}/keystore"
          mkdir -p "${TMP_KEYSTORE_DIR_PATH}"
          TMP_KEYSTORE_FILE_PATH="${TMP_KEYSTORE_DIR_PATH}/keystore.jks"
          echo "${ENCODED_KEYSTORE}" | base64 -di > "${TMP_KEYSTORE_FILE_PATH}"
          echo "STORE_PATH=${TMP_KEYSTORE_FILE_PATH}" >> "$GITHUB_ENV"

      # A dry run uploads nothing, so it needs no Play key.
      - name: Decode Google Play service account key
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        env:
          ENCODED_SERVICE_KEY: ${{ secrets.GPLAY_SERVICE_ACCOUNT_KEY_JSON_BASE64 }}
        run: |
          TMP_SERVICEKEY_DIR="${RUNNER_TEMP}/gplaykey"
          mkdir -p "${TMP_SERVICEKEY_DIR}"
          TMP_SERVICEKEY_FILE_PATH="${TMP_SERVICEKEY_DIR}/service_account.json"
          echo "${ENCODED_SERVICE_KEY}" | base64 -di > "${TMP_SERVICEKEY_FILE_PATH}"
          # An unset secret decodes to an empty file and exits 0, so the failure would
          # otherwise only surface in supply after the bundle build.
          if ! jq -e . "${TMP_SERVICEKEY_FILE_PATH}" >/dev/null 2>&1; then
            echo "::error::GPLAY_SERVICE_ACCOUNT_KEY_JSON_BASE64 is missing or not valid base64-encoded JSON in this environment." >&2
            exit 1
          fi
          echo "SUPPLY_JSON_KEY=${TMP_SERVICEKEY_FILE_PATH}" >> "$GITHUB_ENV"

      - name: Checkout source code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup project and build environment
        uses: ./.github/actions/common-setup

      - name: Set up Ruby
        uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b #v1.321.0
        with:
          ruby-version: 3.3.6
          bundler-cache: true
          working-directory: fastlane

      - name: Verify fastlane Bundler wiring
        run: bundle exec fastlane --version

      - name: Assemble production bundle
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: ./gradlew :app:bundleGplayRelease
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}

      - name: Assemble production bundle and upload to Google Play
        if: "!(github.event_name == 'workflow_dispatch' && inputs.dry_run)"
        run: bundle exec fastlane production
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
